services:
  db:
    image: postgis/postgis:15-3.3
    container_name: urban_advisor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: urban_advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/var/lib/postgresql/csv_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_advisor"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urban_advisor_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=urban_advisor;Username=postgres;Password=supersecretpassword"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: