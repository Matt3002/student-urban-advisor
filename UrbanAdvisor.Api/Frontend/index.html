<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Advisor - Accessibilità Studentesca</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* La mappa deve avere un'altezza definita, altrimenti scompare */
        #map { height: 100vh; width: 100%; }
        .sidebar { height: 100vh; overflow-y: auto; background: #f8f9fa; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1000; position: relative;}
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-3 sidebar">
            <h3 class="mb-4 text-primary">Urban Advisor</h3>
            <p class="text-muted">Clicca su un punto qualsiasi della mappa per calcolare lo Student Accessibility Score.</p>
            
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Score Selezionato</h5>
                    <h2 id="scoreDisplay" class="display-4 text-success">--</h2>
                    <p id="scoreDettaglio" class="card-text">Nessun punto selezionato.</p>
                </div>
            </div>
            <hr>
            <h5>Contesto Temporale</h5>
            <div class="mb-3">
                <label for="oraInput" class="form-label">Ora del giorno (0-23):</label>
                <input type="number" class="form-control" id="oraInput" value="14" min="0" max="23">
            </div>

            <hr>
            <h5>Filtri Layer</h5>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="layerBiblioteche" checked>
                <label class="form-check-label" for="layerBiblioteche">Biblioteche e Aule Studio</label>
            </div>
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" id="layerFermate">
                <label class="form-check-label" for="layerFermate">Fermate Autobus (TPER)</label>
            </div>
        </div>

        <div class="col-md-9">
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
